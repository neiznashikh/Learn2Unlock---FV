name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup and Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace
          build-root-directory: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learn2Unlock-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create or Update Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v4.0-${{ github.run_number }}"
          name: "Build v4.0 #${{ github.run_number }}"
          body: |
            ## Learn2Unlock Latest Build
            Automatically generated APK for testing.
            
            **Note:** This is a debug build. You may need to disable Play Protect to install it.
          files: android/app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
